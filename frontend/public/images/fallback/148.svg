  <text x="300" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="4" fill="#7a6b5d">DESIGN 148</text>
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="#8b6f52" stroke-opacity="0.28" stroke-width="2"/>
