      <stop offset="0" stop-color="hsl(116, 42%, 95%)"/>
      <stop offset="1" stop-color="hsl(154, 34%, 82%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
